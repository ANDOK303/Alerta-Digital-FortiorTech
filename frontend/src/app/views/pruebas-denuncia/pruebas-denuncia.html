<div style="max-width: 600px; margin: 40px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center;">
  <img src="logo.png" alt="Alerta Digital Logo" style="width: 80px; margin-bottom: 15px;">
  <h2 style="color: var(--azul-marino);">ADJUNTAR PRUEBAS DE DENUNCIA</h2>
  <p style="color: var(--gris-oscuro);">Sube capturas o documentos de respaldo para tu caso.</p>

  <form style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px; text-align: left;">
    <input type="file" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
    <textarea placeholder="Descripción de la evidencia..." rows="3" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
    <button type="button" class="btn btn-primary" (click)="subirPrueba()">SUBIR ARCHIVO</button>
  </form>
</div>
