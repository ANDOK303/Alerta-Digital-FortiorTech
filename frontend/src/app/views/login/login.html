<div class="login-page">
  <div class="login-panel">

    <!-- Panel de marca -->
    <div class="login-brand">
      <div class="login-brand-icon">🛡️</div>
      <h1 class="login-brand-title">AlertaDigital</h1>
      <p class="login-brand-subtitle">Plataforma corporativa de seguridad y reporte de incidentes de FortiorTech.</p>

      <ul class="login-brand-features">
        <li>✓ Reportes seguros y confidenciales</li>
        <li>✓ Acompañamiento y orientación</li>
        <li>✓ Monitoreo en tiempo real</li>
      </ul>
    </div>

    <!-- Panel de formulario -->
    <div class="login-form-panel">
      <img src="assets/logo.png" alt="Logo Alerta Digital" class="login-logo">
      <h2 class="login-title">Acceso al Sistema</h2>
      <p class="login-subtitle">Inicie sesión en su cuenta corporativa</p>

      <form class="login-form">
     <label class="login-label">Usuario o correo</label>
<input type="text" placeholder="nombre@fortiortech.com" [(ngModel)]="correo_electronico" name="correo_electronico">
 
<label class="login-label">Contraseña</label>
<input type="password" placeholder="••••••••" [(ngModel)]="contrasena" name="contraseña">
 

        <button type="submit" class="btn btn-primary login-submit" (click)="iniciarSesion()">Iniciar sesión</button>
      </form>

      <div class="login-links">
        <span class="login-links-sep">•</span>
        <a routerLink="/registro">Crear cuenta</a>
      </div>
    </div>

  </div>
</div>
