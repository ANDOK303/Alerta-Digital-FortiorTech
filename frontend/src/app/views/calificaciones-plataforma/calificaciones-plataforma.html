<div class="contenedor vista-admin vista-calificar">

  <!-- Encabezado -->
  <div class="vista-header">
    <div class="vista-header-titulo">
      <span class="vista-icono">⭐</span>
      <div>
        <h2>Califica nuestra plataforma</h2>
        <p class="vista-subtitulo">Tu opinión nos ayuda a mejorar Alerta Digital</p>
      </div>
    </div>
  </div>

  <!-- Formulario -->
  <div class="card form-card">
    <div class="form-card-header">
      <span class="form-card-icono">💡</span>
      <div>
        <h3>Nueva calificación</h3>
        <p class="form-card-subtitulo">Elige una puntuación y cuéntanos tu experiencia</p>
      </div>
    </div>

    <form class="form-vista">
      <div class="form-grid">

        <div class="form-field-wrap">
          <label class="form-label" for="puntuacion">Puntuación</label>
          <select class="form-field" id="puntuacion" name="puntuacion">
            <option value="5">⭐⭐⭐⭐⭐ Excelente</option>
            <option value="4">⭐⭐⭐⭐ Muy bueno</option>
            <option value="3">⭐⭐⭐ Regular</option>
            <option value="2">⭐⭐ Malo</option>
            <option value="1">⭐ Pésimo</option>
          </select>
        </div>

        <div class="form-field-wrap">
          <label class="form-label" for="area">Área a evaluar</label>
          <select class="form-field" id="area" name="area">
            <option value="General">Evaluación general</option>
            <option value="Foro">Foro</option>
            <option value="Soporte">Soporte / Atención</option>
          </select>
        </div>

        <div class="form-field-wrap form-field-full">
          <label class="form-label" for="comentarios">Comentarios</label>
          <textarea class="form-field" id="comentarios" name="comentarios" rows="3"
                    placeholder="Déjanos tus comentarios..."></textarea>
        </div>

        <div class="form-field-full">
          <label class="form-check" for="recomienda">
            <input type="checkbox" id="recomienda" name="recomienda" checked>
            <span>Recomendaría este sitio</span>
          </label>
        </div>

      </div>

      <div class="form-footer">
        <button type="button" class="btn btn-secondary btn-volver" routerLink="/home">
          ← Volver a inicio
        </button>
        <button type="button" class="btn btn-success form-submit" (click)="enviarCalificacion()">Enviar calificación</button>
      </div>
    </form>
  </div>

</div>
