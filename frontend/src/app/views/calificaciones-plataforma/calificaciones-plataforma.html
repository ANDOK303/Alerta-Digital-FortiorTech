<div style="max-width: 500px; margin: 40px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center;">
  <img src="logo.png" alt="Logo" style="width: 60px; margin-bottom: 10px;">
  <h2 style="color: var(--azul-marino);">CALIFICA NUESTRA PLATAFORMA</h2>

  <form style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px; text-align: left;">
    <select style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      <option value="5">⭐⭐⭐⭐⭐ Excelente</option>
      <option value="4">⭐⭐⭐⭐ Muy Bueno</option>
      <option value="3">⭐⭐⭐ Regular</option>
      <option value="2">⭐⭐ Malo</option>
      <option value="1">⭐ Pésimo</option>
    </select>

    <select style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      <option value="General">Evaluación General</option>
      <option value="Foro">Foro</option>
      <option value="Soporte">Soporte/Atención</option>
    </select>

    <textarea placeholder="Déjanos tus comentarios..." rows="3" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
      <input type="checkbox" id="recomienda" checked>
      <label for="recomienda" style="color: var(--gris-oscuro);">Recomendaría este sitio</label>
    </div>

    <button type="button" class="btn btn-success" (click)="enviarCalificacion()">ENVIAR CALIFICACIÓN</button>
  </form>
</div>
