<div class="contenedor vista-admin vista-foro">

  <!-- Encabezado -->
  <div class="vista-header">
    <div class="vista-header-titulo">
      <span class="vista-icono">💬</span>
      <div>
        <h2>Publicación en el foro</h2>
        <p class="vista-subtitulo">Comparte tu mensaje con la comunidad de forma segura</p>
      </div>
    </div>
  </div>

  <!-- Formulario -->
  <div class="card form-card">
    <div class="form-card-header">
      <span class="form-card-icono">✍️</span>
      <div>
        <h3>Nueva publicación</h3>
        <p class="form-card-subtitulo">Escribe tu mensaje y, si quieres, adjunta una imagen</p>
      </div>
    </div>

    <form class="form-vista">
      <div class="form-grid">

        <div class="form-field-wrap form-field-full">
          <label class="form-label" for="alias">Alias</label>
          <input class="form-field" id="alias" name="alias" type="text"
                 placeholder="Ej. UsuarioAnonimo25" [(ngModel)]="alias">
          <span class="form-hint">Si lo dejas en blanco, tu mensaje se publicará como Anónimo.</span>
        </div>

        <div class="form-field-wrap form-field-full">
          <label class="form-label" for="mensaje">Mensaje</label>
          <textarea class="form-field" id="mensaje" name="mensaje" rows="4"
                    placeholder="Escribe tu mensaje aquí..." [(ngModel)]="mensaje"></textarea>
        </div>

        <div class="form-field-wrap form-field-full">
          <label class="form-label" for="imagen">Adjuntar imagen (opcional)</label>
          <input class="form-file" id="imagen" name="imagen" type="file" accept="image/*" (change)="onArchivoSeleccionado($event)">
          <span class="form-hint">Formatos de imagen: JPG, PNG, etc.</span>
        </div>

      </div>

      <div class="form-footer">
        <button type="button" class="btn btn-primary form-submit" (click)="publicarMensaje()">Enviar publicación</button>
      </div>
    </form>
  </div>

</div>
