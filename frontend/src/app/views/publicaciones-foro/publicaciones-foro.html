<div style="max-width: 700px; margin: 40px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
  <div style="display: flex; align-items: center; gap: 15px; border-bottom: 2px solid var(--fondo-blanco); padding-bottom: 15px; margin-bottom: 20px;">
    <img src="logo.png" alt="Logo" style="width: 50px;">
    <h2 style="color: var(--azul-marino); margin: 0;">PUBLICACIÓN EN EL FORO</h2>
  </div>

  <form style="display: flex; flex-direction: column; gap: 15px;">
    <input type="text" placeholder="Alias (Dejar en blanco para Anónimo)" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
    <textarea placeholder="Escribe tu mensaje aquí..." rows="4" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
    <label style="font-size: 14px; color: var(--gris-oscuro);">Adjuntar Imagen (Opcional):</label>
    <input type="file" accept="image/*" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
    <button type="button" class="btn btn-secondary" (click)="publicarMensaje()">ENVIAR PUBLICACIÓN</button>
  </form>
</div>
