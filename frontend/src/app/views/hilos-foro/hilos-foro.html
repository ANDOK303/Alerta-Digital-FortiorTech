<div class="contenedor vista-admin">

  <!-- Encabezado -->
  <div class="vista-header">
    <div class="vista-header-titulo">
      <span class="vista-icono">💬</span>
      <div>
        <h2>Hilos del foro</h2>
        <p class="vista-subtitulo">Conversaciones y publicaciones de la comunidad</p>
      </div>
    </div>

    <div class="vista-header-acciones">
      <button type="button" class="btn btn-secondary btn-volver" routerLink="/home">
        ← Volver a inicio
      </button>
      <button type="button" class="btn btn-primary btn-nuevo-hilo" routerLink="/publicaciones-foro">
        <span>＋</span> Publicar Foro
      </button>
    </div>
  </div>

  <!-- Tarjetas de hilos -->
  <div class="hilos-grid">
    <div class="hilo-card" *ngFor="let h of hilos">
      <div class="hilo-card-top">
        <span class="badge" [ngClass]="'badge-' + h.estado">{{ h.estado }}</span>
        <span class="hilo-respuestas">💬 {{ h.total_respuestas }}</span>
      </div>

      <h3 class="hilo-titulo">{{ h.titulo }}</h3>
      <p class="hilo-contenido">{{ h.contenido_inicial }}</p>

      <div class="hilo-card-footer">
        <span class="hilo-autor">🕵️ {{ h.alias_anonimo || 'Anónimo' }}</span>
        <span class="hilo-usuario">{{ h.usuario }}</span>
      </div>
    </div>

    <!-- Estado vacío -->
    <div class="hilos-empty" *ngIf="hilos.length === 0">
      <span class="hilos-empty-icono">🗨️</span>
      <p>Aún no hay hilos publicados</p>
      <span class="hilos-empty-sub">Sé el primero en iniciar una conversación</span>
    </div>
  </div>

</div>
